<!DOCTYPE html>

<html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>Pet Shop</title> <style> :root{ --bg:#0f1b2a; --panel:#16273a; --panel2:#1d3348; --ink:#eaf3fb; --dim:#9fb6cc; --accent:#4fd1c5; --warn:#ffb454; --bad:#ff6b6b; --good:#5ddc7a; --tray:#122234; } *{box-sizing:border-box; -webkit-tap-highlight-color:transparent} html,body{margin:0;height:100%} body{ background:radial-gradient(1200px 700px at 50% -10%, #1b3350 0%, var(--bg) 60%); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; display:flex;flex-direction:column;min-height:100%; overscroll-behavior:none; } header{ padding:10px 14px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap; border-bottom:1px solid #22384f;background:linear-gradient(180deg,#16273a,#12202f); } h1{font-size:17px;margin:0;letter-spacing:.4px} h1 span{color:var(--accent)} .clock{font-size:12px;color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums} .pill{ font-size:11px;padding:3px 8px;border-radius:999px;background:#1d3348;color:var(--dim); border:1px solid #2b445c;white-space:nowrap; } .pill.on{background:#1f4a3f;color:#8ff0c8;border-color:#2f6b58} main{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 10px 0;min-height:0} .grid{ display:grid;grid-template-columns:repeat(3,1fr);gap:8px; } .hab{ position:relative;border-radius:14px;overflow:hidden;border:1px solid #2b445c; background:#0d1a27;cursor:pointer;aspect-ratio:1/1;min-height:96px; display:flex;flex-direction:column; } .hab canvas{width:100%;height:100%;display:block;flex:1} .hab .cap{ position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10px; background:linear-gradient(0deg,rgba(6,14,22,.92),rgba(6,14,22,0)); display:flex;justify-content:space-between;gap:4px;align-items:flex-end; } .hab .nm{font-weight:600;font-size:11px} .hab .needs{display:flex;gap:3px} .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 6px rgba(93,220,122,.6)} .dot.warn{background:var(--warn);box-shadow:0 0 6px rgba(255,180,84,.6)} .dot.bad{background:var(--bad);box-shadow:0 0 6px rgba(255,107,107,.7);animation:pulse 1.1s infinite} @keyframes pulse{50%{opacity:.35}} .hab.sel{outline:2px solid var(--accent);outline-offset:-2px} .hab .badge{ position:absolute;top:5px;right:5px;font-size:9px;padding:2px 6px;border-radius:999px; background:rgba(255,107,107,.9);color:#2a0d0d;font-weight:700;display:none; } .hab .badge.show{display:block}
/* expanded view */ .expand{ position:fixed;inset:0;z-index:40;background:rgba(6,13,20,.86);backdrop-filter:blur(4px); display:none;flex-direction:column;padding:10px; } .expand.show{display:flex} .expand .top{display:flex;align-items:center;gap:8px;margin-bottom:8px} .expand .top h2{margin:0;font-size:16px} .expand .top button{ margin-left:auto;background:#22384f;color:var(--ink);border:1px solid #33506c; border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer; } .stage{ flex:1;border-radius:16px;overflow:hidden;border:1px solid #2b445c;background:#0b1723; display:flex;min-height:0; } .stage canvas{width:100%;height:100%;display:block} .tasks{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow:auto} .task{ display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid #2b445c; border-radius:12px;padding:8px 10px;font-size:12.5px; } .task .t{flex:1} .task .sub{color:var(--dim);font-size:11px;display:block;margin-top:2px} .task.done{opacity:.55} .task .go{ background:var(--accent);color:#06231f;border:0;border-radius:9px;padding:7px 11px; font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap; } .task .go[disabled]{background:#2b445c;color:#7d94a9;cursor:default} .task .go.alt{background:#ffb454;color:#3a2405}

/* tray */ .tray{ border-top:1px solid #22384f;background:var(--tray);padding:8px 10px 12px; position:sticky;bottom:0;z-index:20; } .tray .lbl{font-size:11px;color:var(--dim);margin:0 0 6px;display:flex;gap:8px;align-items:center} .tray .lbl b{color:var(--ink)} .tools{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin} .tool{ flex:0 0 auto;width:74px;border-radius:12px;border:1px solid #2b445c;background:var(--panel); color:var(--ink);padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px; cursor:pointer;font-size:10px;line-height:1.15;text-align:center; } .tool .ic{font-size:20px;line-height:1} .tool.sel{border-color:var(--accent);background:#1c3b46;box-shadow:0 0 0 1px var(--accent) inset} .tool:active{transform:translateY(1px)} .toast{ position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60; background:#0d2233;border:1px solid #33506c;color:var(--ink);padding:9px 14px;border-radius:12px; font-size:12.5px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .22s; } .toast.show{opacity:1} .hand{ position:fixed;right:12px;bottom:104px;z-index:55;background:#0d2233;border:1px solid var(--accent); color:var(--ink);border-radius:999px;padding:6px 12px;font-size:11.5px;display:none; } .hand.show{display:block} .hint{font-size:11px;color:var(--dim);text-align:center;padding:0 10px 6px} @media (max-width:420px){ .hab .cap{font-size:9px} .tool{width:68px} } </style>
</head> <body> <header> <h1>🐾 Pet <span>Shop</span></h1> <span class="pill" id="p-notify">notifications off</span> <span class="pill" id="p-save">saving…</span> <span class="clock" id="clock">--:--</span> </header> <main> <div class="grid" id="grid"></div> <div class="hint">Tap a habitat to open the wide view · pick a tool from the tray, then tap a habitat to use it</div> </main> <div class="expand" id="expand"> <div class="top"> <h2 id="ex-title">Habitat</h2> <button id="ex-close">Close ✕</button> </div> <div class="stage"><canvas id="ex-canvas"></canvas></div> <div class="tasks" id="ex-tasks"></div> </div> <div class="hand" id="hand">🖐 holding: <b id="hand-name">—</b></div> <div class="toast" id="toast"></div> <div class="tray"> <p class="lbl">Tool tray — <b id="tray-hint">nothing in hand</b></p> <div class="tools" id="tools"></div> </div> <script> /* ============================================================ Pet Shop — single file app ============================================================ */ const DAY = 86400000; const HOUR = 3600000; const MIN = 60000; /* ---------- species data ---------- */ const FISH_TYPES = [ { id:'betta', name:'Betta', color:'#7c5cff', accent:'#ff6fae', speed:0.9 }, { id:'goldfish', name:'Goldfish', color:'#ffb020', accent:'#ff7a18', speed:1.1 }, { id:'longfish', name:'Longfish', color:'#4fd1c5', accent:'#2f9e8f', speed:0.7 } ]; const HAM_TYPES = [ { id:'brown', name:'Brown', color:'#b07a4a', accent:'#e0b183' }, { id:'grey', name:'Grey', color:'#9aa4ad', accent:'#c8d1d8' }, { id:'black', name:'Black', color:'#4a4f57', accent:'#7d858e' } ]; const BIRD_TYPES = [ { id:'sunny', name:'Sunny', color:'#ffd34d', accent:'#ff9f1c' }, { id:'bluey', name:'Bluey', color:'#5aa9ff', accent:'#2f6fd0' }, { id:'minty', name:'Minty', color:'#7ee0a8', accent:'#3aa96b' } ]; /* ---------- tools ---------- */ const TOOLS = [ { id:'flakes', name:'Fish flakes', icon:'🥣', hint:'50 flakes per fish, every day' }, { id:'scoop', name:'Food scoop', icon:'🥄', hint:'3 scoops per hamster, every day' }, { id:'sprinkle', name:'Seed sprinkle',icon:'🌾', hint:'1 sprinkle per bird, every day' }, { id:'filter', name:'Filter', icon:'🧰', hint:'Change the tank filter every 2 weeks' }, { id:'glass', name:'Glass cloth', icon:'🧽', hint:'Clean the glass every 3 days' }, { id:'screw', name:'Screwdriver', icon:'🪛', hint:'Fix a hamster wheel, once a year' }, { id:'wheel', name:'Wheel handle', icon:'🎡', hint:'1 minute of attention per hamster, daily' }, { id:'swing', name:'Bird swing', icon:'🪺', hint:'1 minute of play per bird, daily' } ]; /* ---------- habitat definitions ---------- */ const HABITATS = [ { id:'tank', name:'Fish Tank', kind:'fish', animals:FISH_TYPES, tint:'#0e2b3a' }, { id:'cage', name:'Hamster Cage', kind:'hamster', animals:HAM_TYPES, tint:'#2a2118' }, { id:'aviary',name:'Bird Aviary', kind:'bird', animals:BIRD_TYPES, tint:'#122a22' } ]; /* ---------- task definitions per kind ---------- */ function taskDefs(kind){ if(kind==='fish') return [ { id:'feed', label:'Feed 50 flakes', every:DAY, tool:'flakes', per:'each fish' }, { id:'glass', label:'Clean the glass', every:3*DAY, tool:'glass', per:'tank' }, { id:'filter', label:'Change the filter', every:14*DAY,tool:'filter', per:'tank' } ]; if(kind==='hamster') return [ { id:'feed', label:'3 scoops of food', every:DAY, tool:'scoop', per:'each hamster' }, { id:'play', label:'1 minute of attention',every:DAY, tool:'wheel', per:'each hamster', duration:MIN }, { id:'wheel', label:'Fix the wheel', every:365*DAY, tool:'screw', per:'cage' } ]; return [ { id:'feed', label:'1 sprinkle of food', every:DAY, tool:'sprinkle', per:'each bird' }, { id:'play', label:'1 minute of play', every:DAY, tool:'swing', per:'each bird', duration:MIN } ]; } /* ---------- state ---------- */ const SAVE_KEY = 'petshop.save.v1'; let state = null; function freshState(){ const s = { v:1, created:Date.now(), habitats:{}, hand:null }; HABITATS.forEach(h=>{ const hab = { id:h.id, kind:h.kind, tasks:{}, animals:{} }; taskDefs(h.kind).forEach(t=>{ hab.tasks[t.id] = { last: Date.now() - t.every*0.92 }; }); h.animals.forEach(a=>{ hab.animals[a.id] = { id:a.id, name:a.name, fedAt:0, playedAt:0, mood:1, x:Math.random(), y:Math.random(), dir:Math.random()<.5?-1:1, phase:Math.random()*6.28, vx:0, vy:0 }; }); s.habitats[h.id] = hab; }); return s; } function load(){ try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ const p = JSON.parse(raw); if(p && p.v===1 && p.habitats){ // merge in any new tasks/animals const base = freshState(); HABITATS.forEach(h=>{ const bp = base.habitats[h.id], pp = p.habitats[h.id]; if(!pp){ p.habitats[h.id] = bp; return; } taskDefs(h.kind).forEach(t=>{ if(!pp.tasks[t.id]) pp.tasks[t.id] = bp.tasks[t.id]; }); h.animals.forEach(a=>{ if(!pp.animals[a.id]) pp.animals[a.id] = bp.animals[a.id]; }); }); p.hand = null; return p; } } }catch(e){} return freshState(); } let saveTimer = null; function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); const el = document.getElementById('p-save'); el.textContent = 'saved'; el.classList.add('on'); clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ el.textContent='autosave on'; }, 1200); }catch(e){ document.getElementById('p-save').textContent = 'not saving'; } } /* ---------- time helpers ---------- */ function startOfDay(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); } function fmtDur(ms){ if(ms<=0) return 'now'; const h = Math.floor(ms/HOUR), m = Math.floor((ms%HOUR)/MIN); if(h>=48) return Math.floor(h/24)+'d '+ (h%24) +'h'; if(h>=1) return h+'h '+m+'m'; return Math.max(1,m)+'m'; } function taskStatus(hab, t){ const st = hab.tasks[t.id]; const due = st.last + t.every; const now = Date.now(); const overdue = now - due; return { due, overdue, ready: overdue >= 0, ratio: Math.min(1, (now - st.last)/t.every), label: overdue >= 0 ? 'due now' : 'in ' + fmtDur(-overdue) }; } /* ---------- notifications ---------- */ let notifyOn = false; function initNotify(){ const el = document.getElementById('p-notify'); if(!('Notification' in window)){ el.textContent='no notifications'; return; } if(Notification.permission === 'granted'){ notifyOn = true; el.textContent='notifications on'; el.classList.add('on'); return; } el.style.cursor='pointer'; el.addEventListener('click', ()=>{ Notification.requestPermission().then(p=>{ if(p==='granted'){ notifyOn=true; el.textContent='notifications on'; el.classList.add('on'); toast('Notifications on — you will be pinged when a pet needs you.'); } else { el.textContent='notifications blocked'; } }); }); } let lastNotify = 0; function maybeNotify(){ if(!notifyOn) return; const now = Date.now(); if(now - lastNotify < 30*MIN) return; const urgent = collectUrgent(); if(!urgent.length) return; lastNotify = now; const names = urgent.slice(0,3).map(u=>u.text).join(' · '); try{ new Notification('Pet Shop — someone needs you', { body: names + (urgent.length>3 ? ' (+'+(urgent.length-3)+' more)' : ''), tag:'petshop-needs', renotify:true }); }catch(e){} } function collectUrgent(){ const out = []; HABITATS.forEach(h=>{ const hab = state.habitats[h.id]; taskDefs(h.kind).forEach(t=>{ const s = taskStatus(hab,t); if(s.ready) out.push({ hab:h, text:h.name+': '+t.label }); }); }); return out; } /* ---------- toast ---------- */ let toastT=null; function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 2200); } /* ---------- hand / tools ---------- */ function renderTools(){ const wrap = document.getElementById('tools'); wrap.innerHTML = ''; TOOLS.forEach(t=>{ const b = document.createElement('button'); b.className = 'tool' + (state.hand===t.id?' sel':''); b.innerHTML = '<span class="ic">'+t.icon+'</span><span>'+t.name+'</span>'; b.title = t.hint; b.addEventListener('click', ()=>{ state.hand = (state.hand===t.id) ? null : t.id; renderTools(); renderHand(); renderGrid(); toast(state.hand ? t.icon+' '+t.name+' in hand — now tap a habitat.' : 'Hands empty.'); }); wrap.appendChild(b); }); } function renderHand(){ const h = document.getElementById('hand'); const t = TOOLS.find(x=>x.id===state.hand); if(t){ h.classList.add('show'); document.getElementById('hand-name').textContent = t.name; } else h.classList.remove('show'); document.getElementById('tray-hint').textContent = t ? t.name+' in hand' : 'nothing in hand'; } /* ---------- apply a tool ---------- */ function applyTool(habId){ const hab = state.habitats[habId]; const hdef = HABITATS.find(h=>h.id===habId); const toolId = state.hand; if(!toolId){ openExpand(habId); return; } const defs = taskDefs(hab.kind); const match = defs.find(d=>d.tool===toolId); if(!match){ toast('That tool does not belong in the '+hdef.name.toLowerCase()+'.'); return; } const st = taskStatus(hab, match); if(!st.ready){ toast(match.label+' is not due yet — '+st.label+'.'); return; } // per-animal tasks need a specific animal; do them all at once for convenience if(match.duration){ startMiniGame(habId, match, hdef); return; } hab.tasks[match.id].last = Date.now(); if(match.id==='feed'){ Object.values(hab.animals).forEach(a=>{ a.fedAt = Date.now(); a.mood = 1; }); } toast('✅ '+match.label+' done for the '+hdef.name.toLowerCase()+'.'); state.hand = null; save(); renderAll(); } /* ---------- mini game: 1 minute of attention / play ---------- */ let mini = null; function startMiniGame(habId, match, hdef){ const hab = state.habitats[habId]; const isWheel = match.tool==='wheel'; mini = { habId, taskId:match.id, isWheel, t0: Date.now(), dur: match.duration, spin: 0, lastAngle: null, angle: 0, swing: 0, dir: 1, pos: 0, lastPos: null, done:false }; openExpand(habId); toast(isWheel ? 'Drag in circles on the wheel to spin it for a minute!' : 'Drag the swing back and forth for a minute!'); } function miniTick(){ if(!mini || mini.done) return; const el = Date.now() - mini.t0; if(el >= mini.dur){ mini.done = true; const hab = state.habitats[mini.habId]; hab.tasks[mini.taskId].last = Date.now(); Object.values(hab.animals).forEach(a=>{ a.playedAt = Date.now(); a.mood = 1; }); const wasWheel = mini.isWheel; mini = null; state.hand = null; save(); renderAll(); toast(wasWheel ? '🎡 The hamsters had a great minute on the wheel!' : '🪺 The birds loved their minute on the swing!'); } } /* ---------- canvases ---------- */ const canvases = {}; // habId -> canvas (grid) const exCanvas = document.getElementById('ex-canvas'); let exHab = null; function setupCanvas(cv){ const dpr = Math.min(2, window.devicePixelRatio||1); const r = cv.getBoundingClientRect(); const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height)); if(cv.width !== w*dpr || cv.height !== h*dpr){ cv.width = w*dpr; cv.height = h*dpr; } const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return { ctx, w, h }; } /* ---------- animal motion ---------- */ function moveAnimals(dt){ HABITATS.forEach(h=>{ const hab = state.habitats[h.id]; Object.values(hab.animals).forEach(a=>{ a.phase += dt*2.2; if(h.kind==='fish'){ const sp = (FISH_TYPES.find(f=>f.id===a.id)||{speed:1}).speed; a.x += a.dir * dt * 0.06 * sp; a.y += Math.sin(a.phase*0.9) * dt * 0.03; if(a.x < 0.08){ a.x = 0.08; a.dir = 1; } if(a.x > 0.92){ a.x = 0.92; a.dir = -1; } a.y = Math.max(0.18, Math.min(0.82, a.y)); } else if(h.kind==='hamster'){ a.x += a.dir * dt * 0.09; if(a.x < 0.1){ a.x = 0.1; a.dir = 1; } if(a.x > 0.9){ a.x = 0.9; a.dir = -1; } a.y = 0.72 + Math.sin(a.phase*3)*0.012; } else { a.x += a.dir * dt * 0.05; a.y += Math.sin(a.phase*1.4) * dt * 0.05; if(a.x < 0.12){ a.x = 0.12; a.dir = 1; } if(a.x > 0.88){ a.x = 0.88; a.dir = -1; } a.y = Math.max(0.2, Math.min(0.7, a.y)); } }); }); } /* ---------- drawing ---------- */ function drawHabitat(ctx, w, h, habId, detailed){ const hdef = HABITATS.find(x=>x.id===habId); const hab = state.habitats[habId]; const now = Date.now(); // background const g = ctx.createLinearGradient(0,0,0,h); if(hdef.kind==='fish'){ g.addColorStop(0,'#123c52'); g.addColorStop(1,'#071c28'); } else if(hdef.kind==='hamster'){ g.addColorStop(0,'#3a2c1e'); g.addColorStop(1,'#1b130c'); } else { g.addColorStop(0,'#1d4a3a'); g.addColorStop(1,'#0a1f18'); } ctx.fillStyle = g; ctx.fillRect(0,0,w,h); if(hdef.kind==='fish'){ // water lines ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1; for(let i=0;i<6;i++){ const y = (i+1)*h/7 + Math.sin(now/900 + i)*2; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); } // gravel ctx.fillStyle='#3a2f22'; ctx.beginPath(); ctx.moveTo(0,h); ctx.lineTo(0,h*0.88); for(let x=0;x<=w;x+=14){ ctx.lineTo(x, h*0.88 + Math.sin(x*0.7)*3); } ctx.lineTo(w,h); ctx.closePath(); ctx.fill(); // plants for(let i=0;i<3;i++){ const px = w*(0.16+i*0.33); ctx.strokeStyle = i%2 ? '#2f8f5b' : '#3fae6c'; ctx.lineWidth = Math.max(2, w*0.012); for(let b=0;b<3;b++){ ctx.beginPath(); ctx.moveTo(px+b*4-4, h*0.9); ctx.quadraticCurveTo(px+b*6-6 + Math.sin(now/700+i+b)*5, h*0.6, px+b*8-8 + Math.sin(now/600+i+b)*8, h*0.34); ctx.stroke(); } } // filter box const fst = taskStatus(hab, taskDefs('fish').find(t=>t.id==='filter')); ctx.fillStyle = fst.ready ? '#ff6b6b' : '#2b445c'; ctx.fillRect(w*0.04, h*0.08, Math.max(10,w*0.1), Math.max(12,h*0.14)); ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(w*0.04, h*0.08, Math.max(10,w*0.1), 3); // glass smudge const gst = taskStatus(hab, taskDefs('fish').find(t=>t.id==='glass')); if(gst.ratio > 0.5){ ctx.fillStyle = 'rgba(255,255,255,'+(0.05 + 0.1*(gst.ratio-0.5)*2)+')'; for(let i=0;i<7;i++){ ctx.beginPath(); ctx.ellipse(w*(0.2+ (i%4)*0.2), h*(0.25+ (i%3)*0.2), w*0.05, h*0.03, i, 0, 6.3); ctx.fill(); } } } else if(hdef.kind==='hamster'){ // bedding ctx.fillStyle='#c9a86a'; ctx.beginPath(); ctx.moveTo(0,h); ctx.lineTo(0,h*0.8); for(let x=0;x<=w;x+=10){ ctx.lineTo(x, h*0.8 + Math.sin(x*0.5)*4); } ctx.lineTo(w,h); ctx.closePath(); ctx.fill(); ctx.fillStyle='rgba(0,0,0,.12)'; for(let i=0;i<26;i++){ const x=(i*97)%w, y=h*0.84+((i*53)%Math.max(1,h*0.14)); ctx.fillRect(x,y,6,2); } // wheel const wst = taskStatus(hab, taskDefs('hamster').find(t=>t.id==='wheel')); const cx = w*0.74, cy = h*0.44, R = Math.min(w,h)*0.19; ctx.strokeStyle = wst.ready ? '#ff6b6b' : '#8fa3b5'; ctx.lineWidth = Math.max(2, R*0.14); ctx.beginPath(); ctx.arc(cx,cy,R,0,6.3); ctx.stroke(); ctx.lineWidth = Math.max(1, R*0.07); ctx.strokeStyle = 'rgba(200,220,235,.5)'; for(let i=0;i<8;i++){ const a = i*Math.PI/4 + now/1400; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.stroke(); } // food bowl ctx.fillStyle='#5b6b7a'; ctx.beginPath(); ctx.ellipse(w*0.2, h*0.83, w*0.11, h*0.05, 0,0,6.3); ctx.fill(); const fst = taskStatus(hab, taskDefs('hamster').find(t=>t.id==='feed')); if(fst.ratio < 0.6){ ctx.fillStyle='#e0b183'; ctx.beginPath(); ctx.ellipse(w*0.2, h*0.82, w*0.07, h*0.03, 0,0,6.3); ctx.fill(); } } else { // perches ctx.strokeStyle='#6b4a2a'; ctx.lineWidth=Math.max(3,h*0.02); ctx.beginPath(); ctx.moveTo(w*0.1,h*0.72); ctx.lineTo(w*0.9,h*0.72); ctx.stroke(); ctx.beginPath(); ctx.moveTo(w*0.2,h*0.42); ctx.lineTo(w*0.8,h*0.42); ctx.stroke(); // leaves ctx.fillStyle='#2f8f5b'; for(let i=0;i<5;i++){ const x=w*(0.12+i*0.19), y=h*(0.2+ (i%2)*0.1); ctx.beginPath(); ctx.ellipse(x,y,w*0.05,h*0.03, i, 0, 6.3); ctx.fill(); } // swing const sst = taskStatus(hab, taskDefs('bird').find(t=>t.id==='play')); const swx = w*0.5 + (mini && mini.habId===habId && !mini.isWheel ? Math.sin(now/220)*w*0.16 : 0); ctx.strokeStyle='#c9a86a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(swx-w*0.07, h*0.42); ctx.lineTo(swx-w*0.05, h*0.56); ctx.stroke(); ctx.beginPath(); ctx.moveTo(swx+w*0.07, h*0.42); ctx.lineTo(swx+w*0.05, h*0.56); ctx.stroke(); ctx.fillStyle = sst.ready ? '#ff6b6b' : '#a8792f'; ctx.fillRect(swx-w*0.09, h*0.56, w*0.18, Math.max(4,h*0.03)); // seed dish ctx.fillStyle='#5b6b7a'; ctx.beginPath(); ctx.ellipse(w*0.5, h*0.83, w*0.1, h*0.04, 0,0,6.3); ctx.fill(); } // animals Object.values(hab.animals).forEach(a=>{ const ax = a.x*w, ay = a.y*h; const s = Math.min(w,h) * (hdef.kind==='fish'?0.22:0.26); drawAnimal(ctx, hdef.kind, a, ax, ay, s, now); }); // need dots overlay in detailed view handled by DOM } function drawAnimal(ctx, kind, a, x, y, s, now){ ctx.save(); ctx.translate(x,y); const bob = Math.sin(a.phase)*s*0.05; ctx.translate(0,bob); if(kind==='fish'){ const def = FISH_TYPES.find(f=>f.id===a.id)||FISH_TYPES[0]; ctx.scale(a.dir<0?-1:1, 1); const long = a.id==='longfish'; const bw = s*(long?1.5:1), bh = s*(long?0.5:0.72); // tail ctx.fillStyle = def.accent; ctx.beginPath(); ctx.moveTo(-bw*0.5, 0); ctx.lineTo(-bw*0.95, -bh*0.6 + Math.sin(now/160)*bh*0.2); ctx.lineTo(-bw*0.95, bh*0.6 + Math.sin(now/160)*bh*0.2); ctx.closePath(); ctx.fill(); // body const g = ctx.createLinearGradient(0,-bh,0,bh); g.addColorStop(0, def.color); g.addColorStop(1, def.accent); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0,0,bw*0.5,bh*0.5,0,0,6.3); ctx.fill(); // fin ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(0,bh*0.42,bw*0.22,bh*0.18,0,0,6.3); ctx.fill(); // eye ctx.fillStyle='#0b1016'; ctx.beginPath(); ctx.arc(bw*0.3,-bh*0.14,Math.max(1.2,s*0.07),0,6.3); ctx.fill(); } else if(kind==='hamster'){ const def = HAM_TYPES.find(f=>f.id===a.id)||HAM_TYPES[0]; const r = s*0.5; ctx.fillStyle = def.color; ctx.beginPath(); ctx.ellipse(0,0,r*1.15,r*0.95,0,0,6.3); ctx.fill(); // ears ctx.beginPath(); ctx.arc(-r*0.7,-r*0.8,r*0.34,0,6.3); ctx.fill(); ctx.beginPath(); ctx.arc( r*0.7,-r*0.8,r*0.34,0,6.3); ctx.fill(); ctx.fillStyle = def.accent; ctx.beginPath(); ctx.ellipse(0,r*0.25,r*0.7,r*0.55,0,0,6.3); ctx.fill(); // eyes ctx.fillStyle='#12100e'; ctx.beginPath(); ctx.arc(-r*0.35,-r*0.2,Math.max(1.2,r*0.13),0,6.3); ctx.fill(); ctx.beginPath(); ctx.arc( r*0.35,-r*0.2,Math.max(1.2,r*0.13),0,6.3); ctx.fill(); // nose ctx.fillStyle='#e08a8a'; ctx.beginPath(); ctx.arc(0,r*0.02,Math.max(1,r*0.09),0,6.3); ctx.fill(); } else { const def = BIRD_TYPES.find(f=>f.id===a.id)||BIRD_TYPES[0]; const r = s*0.45; ctx.scale(a.dir<0?-1:1,1); // body ctx.fillStyle = def.color; ctx.beginPath(); ctx.ellipse(0,0,r*1.05,r*0.85,0,0,6.3); ctx.fill(); // head ctx.beginPath(); ctx.arc(r*0.75,-r*0.5,r*0.62,0,6.3); ctx.fill(); // wing ctx.fillStyle = def.accent; ctx.beginPath(); ctx.ellipse(-r*0.1,0,r*0.6,r*0.42,-0.3,0,6.3); ctx.fill(); // beak ctx.fillStyle='#ffb020'; ctx.beginPath(); ctx.moveTo(r*1.3,-r*0.55); ctx.lineTo(r*1.75,-r*0.42); ctx.lineTo(r*1.3,-r*0.28); ctx.closePath(); ctx.fill(); // eye ctx.fillStyle='#0b1016'; ctx.beginPath(); ctx.arc(r*0.92,-r*0.62,Math.max(1.1,r*0.12),0,6.3); ctx.fill(); // tail ctx.fillStyle = def.accent; ctx.beginPath(); ctx.moveTo(-r*0.95,0); ctx.lineTo(-r*1.6,-r*0.5); ctx.lineTo(-r*1.5,r*0.4); ctx.closePath(); ctx.fill(); } ctx.restore(); } /* ---------- grid ---------- */ function renderGrid(){ const grid = document.getElementById('grid'); if(grid.children.length !== HABITATS.length){ grid.innerHTML=''; HABITATS.forEach(h=>{ const d = document.createElement('div'); d.className='hab'; d.dataset.hab=h.id; d.innerHTML = '<canvas></canvas><div class="badge">!</div>'+ '<div class="cap"><span class="nm">'+h.name+'</span><span class="needs"></span></div>'; d.addEventListener('click', ()=>applyTool(h.id)); grid.appendChild(d); canvases[h.id] = d.querySelector('canvas'); }); } HABITATS.forEach(h=>{ const d = grid.querySelector('[data-hab="'+h.id+'"]'); const hab = state.habitats[h.id]; const defs = taskDefs(h.kind); const dots = d.querySelector('.needs'); dots.innerHTML = ''; let anyReady=false; defs.forEach(t=>{ const s = taskStatus(hab,t); const dot = document.createElement('span'); dot.className = 'dot' + (s.ready ? 'bad' : (s.ratio>0.75 ? 'warn':'')); dots.appendChild(dot); if(s.ready) anyReady = true; }); d.querySelector('.badge').classList.toggle('show', anyReady); d.classList.toggle('sel', !!state.hand); }); } /* ---------- expanded view ---------- */ function openExpand(habId){ exHab = habId; const hdef = HABITATS.find(h=>h.id===habId); document.getElementById('ex-title').textContent = hdef.name; document.getElementById('expand').classList.add('show'); renderTasks(); } function closeExpand(){ document.getElementById('expand').classList.remove('show'); exHab = null; mini = null; } document.getElementById('ex-close').addEventListener('click', closeExpand); function renderTasks(){ if(!exHab) return; const hab = state.habitats[exHab]; const hdef = HABITATS.find(h=>h.id===exHab); const wrap = document.getElementById('ex-tasks'); wrap.innerHTML=''; taskDefs(hdef.kind).forEach(t=>{ const s = taskStatus(hab,t); const row = document.createElement('div'); row.className = 'task' + (s.ready?'':' done'); const tool = TOOLS.find(x=>x.id===t.tool); row.innerHTML = '<span style="font-size:18px">'+tool.icon+'</span>'+ '<span class="t"><b>'+t.label+'</b> <span style="color:var(--dim)">('+t.per+')</span>'+ '<span class="sub">'+(s.ready?'⚠ due now':'next in '+fmtDur(-s.overdue))+'</span></span>'; const b = document.createElement('button'); b.className = 'go' + (s.ready?'':' alt'); b.textContent = s.ready ? (t.duration?'Start':'Do it') : 'Not yet'; b.disabled = !s.ready; b.addEventListener('click', ()=>{ state.hand = t.tool; renderTools(); renderHand(); applyTool(exHab); }); row.appendChild(b); wrap.appendChild(row); }); // animal list const list = document.createElement('div'); list.className='task'; list.innerHTML = '<span style="font-size:18px">🐾</span><span class="t"><b>Residents</b>'+ '<span class="sub">'+Object.values(hab.animals).map(a=>a.name).join(' · ')+'</span></span>'; wrap.appendChild(list); } /* ---------- main loop ---------- */ let last = performance.now(); function loop(now){ const dt = Math.min(0.05, (now-last)/1000); last = now; moveAnimals(dt); miniTick(); // grid canvases HABITATS.forEach(h=>{ const cv = canvases[h.id]; if(!cv) return; const {ctx,w,hh} = setupCanvas(cv); drawHabitat(ctx, w, cv.height/(Math.min(2,window.devicePixelRatio||1)), h.id, false); }); // expanded canvas if(exHab){ const {ctx,w,h} = setupCanvas(exCanvas); drawHabitat(ctx, w, h, exHab, true); } requestAnimationFrame(loop); } /* ---------- periodic UI refresh ---------- */ function renderAll(){ renderTools(); renderHand(); renderGrid(); if(exHab) renderTasks(); } setInterval(()=>{ renderGrid(); if(exHab) renderTasks(); maybeNotify(); save(); }, 15000); setInterval(()=>{ const d = new Date(); document.getElementById('clock').textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }, 1000); /* ---------- boot ---------- */ state = load(); initNotify(); renderAll(); requestAnimationFrame(loop); save(); window.addEventListener('resize', ()=>{ renderGrid(); }); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ renderGrid(); if(exHab) renderTasks(); } }); </script> </body> </html>
