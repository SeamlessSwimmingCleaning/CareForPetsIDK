<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7f1">
<title>Pet Pals — More Friends &amp; Care</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f1;color:#21382d;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.intro{max-width:1180px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.intro p{margin:2px 0;color:#62766b}.intro a{color:#1d5a40;font-weight:700}.game{display:block;width:100%;height:calc(100vh - 82px);min-height:700px;border:0;background:#f5f7f1}.pet-name{cursor:pointer;border-radius:5px}.pet-name:hover,.pet-name:focus{outline:2px solid #79b596;outline-offset:2px}.soap-tool{position:absolute;z-index:8;right:12px;top:11px;border:2px solid #fff;background:#fff;padding:6px 10px;border-radius:14px;font-size:23px;box-shadow:0 3px 12px #20352c33;cursor:grab;touch-action:none}.soap-tool[aria-pressed=true]{background:#e5f7eb;outline:3px solid #65a982}.glass-target{position:absolute;z-index:1;left:8%;top:12%;width:84%;height:66%;border:5px solid #fff9;border-radius:14px;background:linear-gradient(135deg,#d9f4f4aa,#ffffff35 48%,#b5e3d477);box-shadow:inset 0 0 0 2px #76ad9a55;display:grid;place-items:center;color:#245b4a;font-size:12px;font-weight:800;text-shadow:0 1px #fff;cursor:pointer;transition:filter .25s,background .25s}.glass-target.cleaned{background:linear-gradient(135deg,#eaffff99,#fff8 48%,#c9f3dc88);filter:brightness(1.12)}.soap-burst{position:fixed;z-index:99;pointer-events:none;font-size:28px;animation:soapPop .8s ease-out forwards}@keyframes soapPop{to{transform:translateY(-55px) scale(1.7);opacity:0}}.feed-burst{position:absolute;z-index:20;right:18px;top:52px;font-size:28px;pointer-events:none;animation:feedPop .9s ease-out forwards}@keyframes feedPop{50%{transform:translate(-45px,36px) scale(1.4)}to{opacity:0;transform:translate(-75px,65px) scale(.7)}}.world.corn{background:linear-gradient(#f9efc8 0 68%,#d4a948 69%)}.world.cow{background:linear-gradient(#e9f4f8 0 68%,#83b879 69%)}.world.frog{background:linear-gradient(#d8f3d9 0 68%,#70ad69 69%)}.world.turtle{background:linear-gradient(#d8f0e2 0 68%,#65a978 69%)}.world.snake{background:linear-gradient(#f3ead4 0 68%,#b8a66e 69%)}.world.spider{background:linear-gradient(#eee5f2 0 68%,#8c7898 69%)}@media(max-width:600px){.intro{padding:10px 13px}.game{height:calc(100vh - 105px);min-height:650px}}
</style>
</head>
<body>
<div class="intro"><div><strong>🌽 More friends, more hands-on care!</strong><p>Added animals, name editing, feeding moments, and soap-window cleaning—your original game is still here.</p></div><a href="./index.html">Open the original version</a></div>
<iframe class="game" id="game" title="Pet Pals enhanced game"></iframe>
<script>
(async()=>{
  const frame=document.getElementById('game');
  try{
    const response=await fetch(new URL('./index.html',location.href));
    if(!response.ok)throw new Error('Could not load the original game.');
    let html=await response.text();
    const addedKinds="corn:{label:'Corn Patch',singular:'Corn',emoji:'🌽',food:'🌽',qty:3,names:['Kernel','Sunny','Cob']},cow:{label:'Cow Pasture',singular:'Cow',emoji:'🐄',food:'🌾',qty:3,names:['Daisy','MooMoo','Clover']},frog:{label:'Frog Pond',singular:'Frog',emoji:'🐸',food:'🪰',qty:2,names:['Lily','Hopper','Peep']},turtle:{label:'Turtle Cove',singular:'Turtle',emoji:'🐢',food:'🥬',qty:2,names:['Shelly','Pebble','Moss']},snake:{label:'Snake Terrarium',singular:'Snake',emoji:'🐍',food:'🐁',qty:1,names:['Slink','Noodle','Ziggy']},spider:{label:'Spider Web',singular:'Spider',emoji:'🕷️',food:'🪰',qty:2,names:['Webster','Spinner','Dot']}";
    html=html.replace(/const TYPES=(\{[\s\S]*?\});\s*const DECOR=/,(_,types)=>'const TYPES='+types.slice(0,-1)+','+addedKinds+'};\nconst DECOR=');
    const styles='\n.pet-name{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}.soap-tool{position:absolute;z-index:8;right:12px;top:11px;border:2px solid #fff;background:#fff;padding:6px 10px;border-radius:14px;font-size:23px;box-shadow:0 3px 12px #20352c33;cursor:grab;touch-action:none}.soap-tool[aria-pressed=true]{background:#e5f7eb;outline:3px solid #65a982}.glass-target{position:absolute;z-index:1;left:8%;top:12%;width:84%;height:66%;border:5px solid #ffffff99;border-radius:14px;background:linear-gradient(135deg,#d9f4f4aa,#ffffff35 48%,#b5e3d477);box-shadow:inset 0 0 0 2px #76ad9a55;display:grid;place-items:center;color:#245b4a;font-size:12px;font-weight:800;text-shadow:0 1px #fff;cursor:pointer;transition:filter .25s}.glass-target.cleaned{filter:brightness(1.2);background:linear-gradient(135deg,#eaffff99,#fff8 48%,#c9f3dc88)}.soap-burst{position:fixed;z-index:99;pointer-events:none;font-size:28px;animation:soapPop .8s ease-out forwards}@keyframes soapPop{to{transform:translateY(-55px) scale(1.7);opacity:0}}.feed-burst{position:absolute;z-index:20;right:18px;top:52px;font-size:28px;pointer-events:none;animation:feedPop .9s ease-out forwards}@keyframes feedPop{50%{transform:translate(-45px,36px) scale(1.4)}to{opacity:0;transform:translate(-75px,65px) scale(.7)}}.world.corn{background:linear-gradient(#f9efc8 0 68%,#d4a948 69%)}.world.cow{background:linear-gradient(#e9f4f8 0 68%,#83b879 69%)}.world.frog{background:linear-gradient(#d8f3d9 0 68%,#70ad69 69%)}.world.turtle{background:linear-gradient(#d8f0e2 0 68%,#65a978 69%)}.world.snake{background:linear-gradient(#f3ead4 0 68%,#b8a66e 69%)}.world.spider{background:linear-gradient(#eee5f2 0 68%,#8c7898 69%)}';
    html=html.replace('</style>',styles+'\n</style>');
    html=html.replace('Feed them yourself, play with the hamsters and birds, and decorate their homes.','Feed, play with, and care for a growing collection of animals in their own habitats.');
    const patch=String.raw`
const baseRenderHabitats=renderHabitats;
renderHabitats=function(){baseRenderHabitats();document.querySelectorAll('.habitat-card').forEach(card=>{const kind=card.dataset.habitat,world=card.querySelector('.world');if(!world)return;const header=card.querySelector('.habitat-header');if(header){const old=header.querySelector('.tiny-btn');if(old)old.remove()}if(world.querySelector('.soap-tool'))return;const target=document.createElement('div');target.className='glass-target';target.textContent=dayCare().cleaned&&dayCare().cleaned.includes(kind)?'✨ Window sparkling clean':'Drop soap here to clean the window';const soap=document.createElement('button');soap.type='button';soap.className='soap-tool';soap.textContent='🧼';soap.draggable=true;soap.setAttribute('aria-label','Drag soap to clean the window and earn coins');soap.setAttribute('aria-pressed','false');let armed=false;function clean(e){if(e)e.preventDefault();const daily=dayCare();daily.cleaned??=[];if(daily.cleaned.includes(kind)){toast('This window is already clean today!');return}daily.cleaned.push(kind);state.coins+=8;target.classList.add('cleaned');target.textContent='✨ Window sparkling clean! +8 coins';soap.remove();save();render();toast(TYPES[kind].label+' cleaned! You earned 8 coins.')}soap.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',kind);e.dataTransfer.effectAllowed='move'});soap.addEventListener('click',()=>{armed=!armed;soap.setAttribute('aria-pressed',String(armed));toast(armed?'Soap ready! Tap the habitat window to clean it.':'Soap put away.')});target.addEventListener('dragover',e=>e.preventDefault());target.addEventListener('drop',e=>{if(e.dataTransfer.getData('text/plain')===kind)clean(e)});target.addEventListener('click',()=>{if(armed)clean()});world.append(target,soap);if(dayCare().cleaned&&dayCare().cleaned.includes(kind)){target.classList.add('cleaned');target.textContent='✨ Window sparkling clean';soap.hidden=true}})};
const baseRenderPets=renderPets;
renderPets=function(){baseRenderPets();document.querySelectorAll('.pet-card .pet-name').forEach(name=>{const card=name.closest('.pet-card'),pet=card&&state.pets.find(p=>p.id===card.dataset.cardPet);if(!pet)return;name.title='Click to change this pet’s name';name.setAttribute('role','button');name.setAttribute('tabindex','0');const rename=()=>{const value=prompt('Choose a new name for your '+TYPES[pet.kind].singular.toLowerCase()+':',pet.name);if(value===null)return;const trimmed=value.trim();if(!trimmed){toast('A pet name cannot be empty.');return}pet.name=trimmed.slice(0,30);save();render();toast('Your pet is now called '+pet.name+'!')};name.addEventListener('click',rename);name.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();rename()}})})};
const baseFeedAction=feedAction;
feedAction=function(id){const pet=state.pets.find(p=>p.id===id);if(pet){const modal=document.querySelector('#feed-modal .modal'),burst=document.createElement('span');burst.className='feed-burst';burst.textContent=TYPES[pet.kind].food;modal.append(burst);setTimeout(()=>burst.remove(),950)}baseFeedAction(id)};
function addCareDefaults(){for(const value of Object.values(state.care||{}))if(value&&typeof value==='object')value.cleaned??=[]}
addCareDefaults();
`;
    const hook='render();requestAnimationFrame(animate);';
    if(!html.includes(hook)||!html.includes('const TYPES='))throw new Error('The original game structure was not recognized; the original page has not been changed.');
    html=html.replace(hook,patch+'\n'+hook);
    frame.srcdoc=html;
  }catch(error){document.querySelector('.intro p').textContent='The original game could not be enhanced here. You can still open the original version.';console.error(error)}
})();
</script>
</body>
</html>
